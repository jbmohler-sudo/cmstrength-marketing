<!DOCTYPE html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; background:#0B0B0C; overflow:hidden; }
.slide { position:relative; width:1080px; height:1350px; background:radial-gradient(1200px 800px at 50% 0%, #17171A 0%, #0B0B0C 62%); padding:96px 90px 80px; display:flex; flex-direction:column; }
.kicker { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:40px; letter-spacing:12px; color:#E8232F; text-transform:uppercase; margin-bottom:44px; }
.head { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:122px; line-height:1.0; letter-spacing:-1px; color:#F4F4F5; text-transform:uppercase; }
.head .red { color:#E8232F; }
.sub { font-family:'Segoe UI','Arial',sans-serif; font-weight:400; font-size:44px; line-height:1.38; color:#A9A9B0; margin-top:44px; max-width:880px; }
.rule { width:140px; height:12px; background:#E8232F; margin-top:48px; }
.spacer { flex:1; min-height:24px; }
.foot { display:flex; align-items:center; gap:30px; margin-top:32px; }
.logo { width:84px; height:84px; background:#E8232F; color:#0B0B0C; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.foottext { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; }
</style></head><body><div class='slide'>
  <div class="kicker">The Adaptive Loop</div>
  <div class="head">No spreadsheet<br>knows how<br><span class="red">you slept.</span></div>
  <div class="rule"></div>
  <div class="sub">CMS reads your recovery every morning — then adjusts today's session around it. Here's the loop.</div>
  <div class="spacer"></div>
  <div class="foot"><div class="logo">CMS</div><div class="foottext">Center Mass Strength &nbsp;·&nbsp; Competition Powerlifting</div></div>
</div></body></html>
