<!DOCTYPE html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; background:#0B0B0C; overflow:hidden; }
.slide { position:relative; width:1080px; height:1350px; background:radial-gradient(1200px 800px at 50% 0%, #17171A 0%, #0B0B0C 62%); padding:86px 90px 70px; display:flex; flex-direction:column; }
.kicker { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:38px; letter-spacing:12px; color:#E8232F; text-transform:uppercase; margin-bottom:30px; }
.head { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:128px; line-height:1.0; letter-spacing:-1px; color:#F4F4F5; text-transform:uppercase; }
.head .red { color:#E8232F; }
.loop { margin-top:40px; display:flex; flex-direction:column; gap:18px; max-width:880px; }
.loop .row { display:flex; align-items:baseline; gap:32px; }
.loop .num { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:52px; color:#E8232F; width:88px; flex-shrink:0; }
.loop .name { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:42px; letter-spacing:1px; color:#F4F4F5; text-transform:uppercase; }
.cta { margin-top:40px; }
.cta .box { display:inline-block; border:6px solid #E8232F; color:#F4F4F5; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:54px; letter-spacing:2px; padding:24px 46px; text-transform:uppercase; }
.cta .note { font-family:'Bahnschrift',sans-serif; font-size:28px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; margin-top:22px; }
.spacer { flex:1; min-height:10px; }
.foot { display:flex; align-items:center; gap:30px; margin-top:24px; }
.logo { width:84px; height:84px; background:#E8232F; color:#0B0B0C; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.foottext { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; }
</style></head><body><div class='slide'>
  <div class="kicker">Start today</div>
  <div class="head">Train what<br>today <span class="red">needs.</span></div>
  <div class="loop">
    <div class="row"><div class="num">01</div><div class="name">Check in — five signals</div></div>
    <div class="row"><div class="num">02</div><div class="name">Plan adapts ±5%</div></div>
    <div class="row"><div class="num">03</div><div class="name">Session, RPE-guided</div></div>
    <div class="row"><div class="num">04</div><div class="name">Film room reads the block</div></div>
  </div>
  <div class="cta"><div class="box">www.cmstrength.fit</div><div class="note">14-day free trial — no card needed</div></div>
  <div class="spacer"></div>
  <div class="foot"><div class="logo">CMS</div><div class="foottext">Center Mass Strength &nbsp;·&nbsp; Competition Powerlifting</div></div>
</div></body></html>
