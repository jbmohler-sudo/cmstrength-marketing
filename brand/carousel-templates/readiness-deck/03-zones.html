<!DOCTYPE html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; background:#0B0B0C; overflow:hidden; }
.slide { position:relative; width:1080px; height:1350px; background:radial-gradient(1200px 800px at 50% 0%, #17171A 0%, #0B0B0C 62%); padding:100px 90px 80px; display:flex; flex-direction:column; }
.kicker { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:40px; letter-spacing:12px; color:#E8232F; text-transform:uppercase; margin-bottom:52px; }
.head { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:124px; line-height:1.0; letter-spacing:-1px; color:#F4F4F5; text-transform:uppercase; }
.head .red { color:#E8232F; }
.head.small { font-size:104px; }
.sub { font-family:'Segoe UI','Arial',sans-serif; font-weight:400; font-size:44px; line-height:1.4; color:#A9A9B0; margin-top:52px; max-width:860px; }
.rule { width:140px; height:12px; background:#E8232F; margin-top:52px; }
.spacer { flex:1; min-height:30px; }
.foot { display:flex; align-items:center; gap:30px; margin-top:36px; }
.logo { width:84px; height:84px; background:#E8232F; color:#0B0B0C; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.foottext { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; }
.shot { margin-top:56px; border-radius:34px; overflow:hidden; border:2px solid #26262C; box-shadow:0 30px 90px rgba(0,0,0,.65); flex:1; min-height:0; position:relative; }
.shot img { display:block; width:100%; height:100%; object-fit:cover; }
.shot .tag { position:absolute; left:34px; bottom:30px; background:rgba(11,11,12,.78); border:1px solid #E8232F; color:#F4F4F5; font-family:'Bahnschrift',sans-serif; font-size:28px; letter-spacing:4px; padding:14px 24px; text-transform:uppercase; }
.zones { margin-top:56px; display:flex; flex-direction:column; gap:30px; }
.zone { display:flex; align-items:center; gap:34px; }
.zone .bar { width:14px; height:96px; background:#E8232F; }
.zone .label { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:104px; line-height:1; color:#F4F4F5; text-transform:uppercase; }
.zone .note { font-family:'Segoe UI','Arial',sans-serif; font-size:36px; color:#A9A9B0; margin-left:auto; text-align:right; max-width:420px; }
.cta { margin-top:56px; }
.cta .box { display:inline-block; border:6px solid #E8232F; color:#F4F4F5; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:58px; letter-spacing:2px; padding:30px 50px; text-transform:uppercase; }
.cta .note { font-family:'Bahnschrift',sans-serif; font-size:28px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; margin-top:30px; }
</style></head><body><div class='slide'>
      <div class="kicker">What the score changes</div>
      <div class="head small">Three targets.<br>One <span class="red">decision.</span></div>
      <div class="zones">
        <div class="zone"><div class="bar"></div><div class="label">Strength</div><div class="note">Green light. Push the planned work.</div></div>
        <div class="zone"><div class="bar"></div><div class="label">Mid-range</div><div class="note">Train as written, hold the line.</div></div>
        <div class="zone"><div class="bar"></div><div class="label">Peak</div><div class="note">Best day of the block. Make it count.</div></div>
      </div>
      <div class="spacer"></div>
      <div class="foot"><div class="logo">CMS</div><div class="foottext">Center Mass Strength &nbsp;·&nbsp; Competition Powerlifting</div></div>
    </div></body></html>
