<!DOCTYPE html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; background:#0B0B0C; overflow:hidden; }
.slide { position:relative; width:1080px; height:1350px; background:radial-gradient(1200px 800px at 50% 0%, #17171A 0%, #0B0B0C 62%); padding:100px 90px 80px; display:flex; flex-direction:column; }
.kicker { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:40px; letter-spacing:12px; color:#E8232F; text-transform:uppercase; margin-bottom:56px; }
.head { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:150px; line-height:1.0; letter-spacing:-1px; color:#F4F4F5; text-transform:uppercase; }
.head .red { color:#E8232F; }
.picks { margin-top:64px; display:flex; flex-direction:column; gap:28px; max-width:860px; }
.pick { display:flex; align-items:center; gap:30px; }
.pick .num { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:60px; color:#E8232F; width:96px; flex-shrink:0; }
.pick .name { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:52px; letter-spacing:2px; color:#F4F4F5; text-transform:uppercase; }
.cta { margin-top:56px; }
.cta .box { display:inline-block; border:6px solid #E8232F; color:#F4F4F5; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:58px; letter-spacing:2px; padding:30px 50px; text-transform:uppercase; }
.cta .note { font-family:'Bahnschrift',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; margin-top:30px; }
.spacer { flex:1; min-height:30px; }
.foot { display:flex; align-items:center; gap:30px; margin-top:36px; }
.logo { width:84px; height:84px; background:#E8232F; color:#0B0B0C; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.foottext { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; }
</style></head><body><div class='slide'>
  <div class="kicker">Start today</div>
  <div class="head">Pick your<br><span class="red">track.</span></div>
  <div class="picks">
    <div class="pick"><div class="num">01</div><div class="name">SBD Full Powerlifting</div></div>
    <div class="pick"><div class="num">02</div><div class="name">Bench Specialization</div></div>
    <div class="pick"><div class="num">03</div><div class="name">Jacked &amp; Strong</div></div>
  </div>
  <div class="cta"><div class="box">www.cmstrength.fit</div><div class="note">SBD · Bench · J&amp;S — 14-day free trial, no card needed</div></div>
  <div class="spacer"></div>
  <div class="foot"><div class="logo">CMS</div><div class="foottext">Center Mass Strength &nbsp;·&nbsp; Competition Powerlifting</div></div>
</div></body></html>
