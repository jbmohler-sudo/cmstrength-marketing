<!DOCTYPE html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; background:#0B0B0C; overflow:hidden; }
.slide { position:relative; width:1080px; height:1350px; background:radial-gradient(1200px 800px at 50% 0%, #17171A 0%, #0B0B0C 62%); padding:96px 90px 80px; display:flex; flex-direction:column; }
.kicker { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:40px; letter-spacing:12px; color:#E8232F; text-transform:uppercase; margin-bottom:40px; }
.trackpill { align-self:flex-start; font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:34px; letter-spacing:8px; color:#F4F4F5; background:#26262C; border:2px solid #E8232F; padding:16px 32px; text-transform:uppercase; margin-bottom:38px; }
.head { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:118px; line-height:1.0; letter-spacing:-1px; color:#F4F4F5; text-transform:uppercase; }
.head .red { color:#E8232F; }
.sub { font-family:'Segoe UI','Arial',sans-serif; font-weight:400; font-size:42px; line-height:1.35; color:#A9A9B0; margin-top:34px; max-width:880px; }
.facts { margin-top:38px; display:flex; flex-direction:column; gap:22px; }
.fact { display:flex; align-items:center; gap:28px; }
.fact .bar { width:12px; height:52px; background:#E8232F; flex-shrink:0; }
.fact .txt { font-family:'Segoe UI','Arial',sans-serif; font-size:42px; line-height:1.25; color:#EDEDF1; max-width:820px; }
.spacer { flex:1; min-height:18px; }
.foot { display:flex; align-items:center; gap:30px; margin-top:28px; }
.logo { width:84px; height:84px; background:#E8232F; color:#0B0B0C; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.foottext { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; }
</style></head><body><div class='slide'>
  <div class="kicker">Track 01</div>
  <div class="trackpill">SBD Full Powerlifting</div>
  <div class="head">Built for<br>the <span class="red">meet.</span></div>
  <div class="sub">Squat, bench, deadlift — programmed toward a meet date, block by block.</div>
  <div class="facts">
    <div class="fact"><div class="bar"></div><div class="txt">Meet-date-driven macrocycle</div></div>
    <div class="fact"><div class="bar"></div><div class="txt">Hyp → strength → peak → taper</div></div>
    <div class="fact"><div class="bar"></div><div class="txt">Loads autoregulate on readiness</div></div>
    <div class="fact"><div class="bar"></div><div class="txt">Build a competitive total</div></div>
  </div>
  <div class="spacer"></div>
  <div class="foot"><div class="logo">CMS</div><div class="foottext">Center Mass Strength &nbsp;·&nbsp; Competition Powerlifting</div></div>
</div></body></html>
