<!DOCTYPE html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; background:#0B0B0C; overflow:hidden; }
.slide { position:relative; width:1080px; height:1350px; background:radial-gradient(1200px 800px at 50% 0%, #17171A 0%, #0B0B0C 62%); padding:100px 90px 80px; display:flex; flex-direction:column; }
.kicker { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:40px; letter-spacing:12px; color:#E8232F; text-transform:uppercase; margin-bottom:52px; }
.head { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:120px; line-height:1.0; letter-spacing:-1px; color:#F4F4F5; text-transform:uppercase; }
.head .red { color:#E8232F; }
.cta { margin-top:64px; }
.cta .box { display:inline-block; border:6px solid #E8232F; color:#F4F4F5; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:58px; letter-spacing:2px; padding:30px 50px; text-transform:uppercase; }
.cta .note { font-family:'Bahnschrift',sans-serif; font-size:28px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; margin-top:30px; }
.spacer { flex:1; min-height:30px; }
.foot { display:flex; align-items:center; gap:30px; margin-top:36px; }
.logo { width:84px; height:84px; background:#E8232F; color:#0B0B0C; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.foottext { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; }
</style></head><body><div class='slide'>
  <div class="kicker">Center Mass Strength</div>
  <div class="head">Train blocks.<br>Not <span class="red">guesswork.</span></div>
  <div class="cta"><div class="box">www.cmstrength.fit</div><div class="note">Competition powerlifting programming · 14-day free trial</div></div>
  <div class="spacer"></div>
  <div class="foot"><div class="logo">CMS</div><div class="foottext">Center Mass Strength &nbsp;·&nbsp; Competition Powerlifting</div></div>
</div></body></html>
