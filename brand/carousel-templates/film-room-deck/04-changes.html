<!DOCTYPE html><html><head><meta charset='utf-8'><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; background:#0B0B0C; overflow:hidden; }
.slide { position:relative; width:1080px; height:1350px; background:radial-gradient(1200px 800px at 50% 0%, #17171A 0%, #0B0B0C 62%); padding:100px 90px 80px; display:flex; flex-direction:column; }
.kicker { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:600; font-size:38px; letter-spacing:12px; color:#E8232F; text-transform:uppercase; margin-bottom:44px; }
.head { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:88px; line-height:1.02; letter-spacing:-1px; color:#F4F4F5; text-transform:uppercase; }
.head .red { color:#E8232F; }
.zones { margin-top:56px; display:flex; flex-direction:column; gap:34px; }
.zone { display:flex; align-items:center; gap:30px; }
.zone .bar { width:14px; height:88px; background:#E8232F; flex-shrink:0; }
.zone .label { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-weight:700; font-size:60px; line-height:1; color:#F4F4F5; text-transform:uppercase; }
.zone .note { font-family:'Segoe UI','Arial',sans-serif; font-size:34px; color:#A9A9B0; margin-left:auto; text-align:right; max-width:440px; }
.cta { margin-top:44px; }
.cta .box { display:inline-block; border:6px solid #E8232F; color:#F4F4F5; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:58px; letter-spacing:2px; padding:28px 46px; text-transform:uppercase; }
.spacer { flex:1; min-height:24px; }
.foot { display:flex; align-items:center; gap:30px; margin-top:30px; }
.logo { width:84px; height:84px; background:#E8232F; color:#0B0B0C; font-family:'Bahnschrift',sans-serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.foottext { font-family:'Bahnschrift','Arial Narrow',sans-serif; font-size:30px; letter-spacing:5px; color:#6E6E76; text-transform:uppercase; }
</style></head><body><div class='slide'>
  <div class="kicker">What changes</div>
  <div class="head">Small moves.<br><span class="red">Made early.</span></div>
  <div class="zones">
    <div class="zone"><div class="bar"></div><div class="label">Load trims</div><div class="note">Stimulus kept, ceiling respected.</div></div>
    <div class="zone"><div class="bar"></div><div class="label">Exercises rotate</div><div class="note">Stress moves off the flagged joint.</div></div>
    <div class="zone"><div class="bar"></div><div class="label">Next block adjusts</div><div class="note">Planned off the read, not a guess.</div></div>
  </div>
  <div class="cta"><div class="box">No guesswork</div></div>
  <div class="spacer"></div>
  <div class="foot"><div class="logo">CMS</div><div class="foottext">Center Mass Strength &nbsp;·&nbsp; Competition Powerlifting</div></div>
</div></body></html>
